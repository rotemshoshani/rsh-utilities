[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-delay"
version = "1.0.0"
description = "Let a coding agent wait on something slow without burning a turn per poll."
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
herdr-delay = "herdr_delay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
