[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-delay"
version = "0.1.0"
description = "Schedule a prompt into a fresh or existing Codex session from a terminal UI."
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
codex-delay = "codex_delay.cli:main"
cdx-later = "codex_delay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
